[project]
name = "modulo3-stub"
version = "0.1.0"
description = "Módulo 3 simulado (enriquecimento de contatos) para testar o CRM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modulo3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
