[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prospeccao"
version = "0.1.0"
description = "Prospecção de empresas recém-abertas a partir dos Dados Abertos do CNPJ (Receita Federal)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "streamlit>=1.50",
    "pandas>=2.0",
    "altair>=5.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
prospeccao = "prospeccao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
