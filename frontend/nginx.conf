server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # A interface e a API ficam na mesma origem: o cookie de sessão não precisa sair daqui.
    location /api/ {
        proxy_pass http://crm-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # sobrescreve: o cliente não consegue forjar o IP da auditoria
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # perguntas ao agente podem demorar
        client_max_body_size 1m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
