[project]
name = "modulo3"
version = "0.2.0"
description = "Módulo 3: contatos complementares dos leads do agente e entrega ao CRM (contrato v1)"
requires-python = ">=3.11"
# O enriquecimento usa o serviço de contatos do módulo 1 (pacote `prospeccao`, pasta etl/).
# Instale-o sem as dependências pesadas dele: pip install --no-deps -e ../etl
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modulo3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
