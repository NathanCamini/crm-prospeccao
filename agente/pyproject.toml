[project]
name = "prospeccao-agente"
version = "0.1.0"
description = "Módulo 2: agente que classifica as empresas novas do mês por perfil de cliente (funil SQL + Gemini)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "google-genai>=2.25",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agente = "agente.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agente*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
